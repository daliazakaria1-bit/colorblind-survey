<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder · Colour Vision & Interior Comfort Study</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B1D5A'/%3E%3Cpath d='M7 16h15M17 10l6 6-6 6' fill='none' stroke='%23FFC857' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2D1548">
<meta name="description" content="A short game-style academic study on visual comfort in public interior spaces. MSA University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   GLASS AURORA THEME
   dark indigo → violet sky, soft glowing blobs, frosted glass surfaces
   ===================================================================== */
:root{
  --bg0:#1A0B2B; --bg1:#2D1548; --bg2:#3B1D5A; --bg3:#C2562F;
  --txt:#FFF8F1; --txt2:#F4E6E2; --txt3:#E6D0D2;
  --glass:rgba(52,20,70,.4); --glass-hi:rgba(255,236,214,.16); --glass-line:rgba(255,222,185,.24);
  --deep:rgba(22,8,34,.58);
  --accent:#FFD27A; --rose:#E7A6C8; --coral:#FF9A7A; --gold:#FFC857; --serif:"Playfair Display","Cairo",Georgia,serif;
  --on-light:#2A1040;
  --sun:linear-gradient(135deg,#FFD98A 0%,#FFAE55 48%,#F2755A 100%);
  --sun-soft:linear-gradient(135deg,rgba(255,217,138,.34),rgba(255,174,85,.28) 50%,rgba(242,117,90,.3));
  --focus:#FFD27A; --r:22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--txt);line-height:1.55;font-size:17px;min-height:100vh;
  background:linear-gradient(176deg,#1A0B2B 0%,#2D1548 24%,#3B1D5A 50%,#6A2A63 72%,#B04A38 90%,#E58F3A 100%) fixed;background-color:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}

/* ----- aurora blobs ----- */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle at 40% 40%,#7A2E8F,transparent 68%);animation:drift1 26s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;right:-12vmax;top:8vh;background:radial-gradient(circle at 50% 50%,#D9552F,transparent 68%);opacity:.3;animation:drift2 31s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;left:18vw;bottom:-22vmax;background:radial-gradient(circle at 50% 50%,#F2A93B,transparent 66%);opacity:.42;animation:drift3 36s ease-in-out infinite alternate}
.b4{width:24vmax;height:24vmax;right:12vw;bottom:6vh;background:radial-gradient(circle at 50% 50%,#FF8A5B,transparent 68%);opacity:.16;animation:drift1 40s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate3d(9vw,7vh,0) scale(1.12)}}
@keyframes drift2{to{transform:translate3d(-10vw,9vh,0) scale(.92)}}
@keyframes drift3{to{transform:translate3d(8vw,-10vh,0) scale(1.1)}}
.stars{position:absolute;inset:0;opacity:.28;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 38% 62%,#fff,transparent),radial-gradient(1px 1px at 88% 70%,#fff,transparent),radial-gradient(1.2px 1.2px at 56% 88%,#fff,transparent),radial-gradient(1px 1px at 22% 84%,#fff,transparent),radial-gradient(1px 1px at 94% 38%,#fff,transparent)}

/* ----- shared glass surface ----- */
.glass,.panel,.card,.steps li,.sign,.rate-top,.bubble,.tab,.chip span,.sw span,.thumb,.scale button,.five button,.ans,.btn.ghost,.xp,.lang,.hero,.scorecard{
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .panel,.card,.steps li,.sign,.bubble,.hero,.scorecard{background:rgba(59,29,90,.93)!important}
}

/* ----- top bar + route ----- */
.top{position:sticky;top:0;z-index:20;background:rgba(26,11,43,.62);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--glass-line);box-shadow:0 8px 30px rgba(14,4,22,.35)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand #brandT{font-family:var(--serif);font-size:21px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;flex:1;min-width:0}
.brand>span:last-child{min-width:0}
.brand small{display:block;font-weight:600;font-size:11.5px;color:var(--txt2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark{width:36px;height:36px;border-radius:12px;background:var(--sun);display:grid;place-items:center;flex:none;box-shadow:0 0 22px rgba(255,169,77,.65),inset 0 1px 0 rgba(255,255,255,.6)}
.brand-mark svg{width:19px;height:19px}
.xp{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:3px 14px;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;position:relative;white-space:nowrap}
.xp b{color:var(--gold);font-size:17px;text-shadow:0 0 12px rgba(255,214,107,.6)}
.pop{position:absolute;inset-inline-end:8px;top:-4px;color:var(--gold);font-weight:900;animation:pop .9s ease-out forwards;pointer-events:none}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
.lang{background:var(--glass);border:1px solid var(--glass-line);color:#fff;border-radius:999px;padding:3px 14px;font-weight:700;cursor:pointer;transition:background .15s}
.lang:hover{background:var(--glass-hi)}
.route{max-width:1180px;margin:0 auto;padding:2px 16px 12px;display:flex;align-items:center}
.stn{flex:1;display:flex;align-items:center;min-width:0}
.stn:last-child{flex:none}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:transparent;flex:none;position:relative}
.stn.done .dot{background:var(--sun);border-color:transparent;box-shadow:0 0 10px rgba(255,169,77,.7)}
.stn.done .dot::after{content:"";position:absolute;inset:1px 4px 3px 4px;border:solid var(--on-light);border-width:0 2px 2px 0;transform:rotate(40deg) scale(.6)}
.stn.now .dot{border-color:transparent;width:32px;height:32px;overflow:hidden;background:#fff;box-shadow:0 0 0 3px var(--rose),0 0 22px rgba(255,210,122,.7)}
.stn.now .dot svg{width:100%;height:100%;display:block}
.stn.now .dot.plain{background:var(--sun)}
.seg{flex:1;height:4px;background:rgba(255,255,255,.18);margin-inline:3px;border-radius:3px}
.stn.done .seg{background:var(--sun)}

main{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:24px 16px 90px}
main.wide{max-width:1180px}
.top{z-index:20}
.sign{display:inline-flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:8px 20px 8px 9px;margin:0 0 14px;box-shadow:0 10px 30px rgba(14,4,22,.3),inset 0 1px 0 rgba(255,255,255,.18)}
[dir=rtl] .sign{padding:8px 9px 8px 20px}
.sign svg{width:34px;height:34px;flex:none;background:var(--sun);color:var(--on-light);border-radius:11px;padding:6px;box-shadow:0 0 16px rgba(255,169,77,.5)}
.sign h1,.sign h2{font-family:var(--serif);margin:0;font-size:22px;font-weight:900;line-height:1.2;color:#fff}
.lead{color:var(--txt2);margin:0 0 18px;max-width:62ch}
.panel,.card,.steps li,.hero,.scorecard{border-color:rgba(255,214,150,.28)}
.panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:22px;box-shadow:0 18px 50px rgba(14,4,22,.38),inset 0 1px 0 rgba(255,255,255,.2)}
.panel+.panel{margin-top:16px}
h3{font-family:var(--serif);margin:0 0 8px;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ----- controls ----- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:13px 26px;font-weight:900;font-size:17px;cursor:pointer;background:var(--sun);color:var(--on-light);box-shadow:0 8px 26px rgba(255,169,77,.45),inset 0 1px 0 rgba(255,255,255,.65);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.07) saturate(1.1);transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,169,77,.6),inset 0 1px 0 rgba(255,255,255,.65)}
.btn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(255,169,77,.4)}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#fff;font-weight:700}
.btn.ghost:hover{background:var(--glass-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.dark{background:rgba(22,8,34,.6);border:1px solid var(--glass-line);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none;filter:grayscale(.35)}
.arr{width:18px;height:18px;flex:none}
[dir=rtl] .arr,[dir=rtl] .brand-mark svg{transform:scaleX(-1)}
.fld{margin:0 0 16px}
.fld>label,.q{display:block;font-weight:700;margin-bottom:6px}
.opt{font-weight:400;color:var(--txt2);font-size:14px}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;padding:12px 14px;border:1px solid var(--glass-line);border-radius:14px;background:var(--deep);color:#fff;font-size:17px;transition:border-color .15s,box-shadow .15s}
select option{background:#2B1445;color:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px rgba(255,210,122,.22);background:rgba(22,8,34,.75)}
textarea{min-height:120px;resize:vertical}
.err{margin:6px 0 0;font-size:14px;font-weight:700;color:#FFB3BD;display:flex;gap:6px;align-items:center}
.err::before{content:"!";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#FFB3BD;color:#4A0715;font-size:12px;flex:none}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:#FFB3BD}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.chip span{display:flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--glass-line);border-radius:999px;background:var(--glass);font-weight:600;cursor:pointer;transition:background .15s,transform .12s}
.chip:hover span{background:var(--glass-hi);transform:translateY(-1px)}
.chip input:checked+span{background:var(--sun);color:var(--on-light);border-color:transparent;box-shadow:0 6px 20px rgba(255,169,77,.5)}
.chip input:checked+span::before{content:"✓";font-weight:900}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:3px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.check input{width:24px;height:24px;margin-top:3px;accent-color:#FFAE55;flex:none}

/* ----- guide character ----- */
.guide{display:flex;align-items:flex-end;gap:12px;margin:0 0 16px}
.guide.big{gap:16px;margin-bottom:20px}
.mascot{flex:none;width:66px;position:relative;animation:bob 3.6s ease-in-out infinite}
.guide.big .mascot{width:92px}
.mascot svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 8px 18px rgba(255,210,122,.35))}
.mascot .face-av{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--rose);box-shadow:0 0 22px rgba(255,169,77,.6);background:#fff}
.mascot .face-av svg{filter:none}
.mascot .eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.mascot .arms-up,.mascot .sparkles,.mascot .mouth-open{display:none}
.mascot.cheer .arms-up,.mascot.cheer .sparkles,.mascot.cheer .mouth-open{display:inline}
.mascot.cheer .arms-down,.mascot.cheer .mouth-smile{display:none}
.mascot.cheer{animation:hop .9s ease-in-out infinite}
.mascot .sparkles{animation:twinkle 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-4deg)}60%{transform:translateY(-4px) rotate(3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.bubble{position:relative;background:rgba(60,24,82,.62);border:1px solid var(--glass-line);border-radius:20px;padding:11px 16px;font-weight:600;font-size:16px;line-height:1.45;box-shadow:0 12px 34px rgba(14,4,22,.35),inset 0 1px 0 rgba(255,255,255,.22);animation:bubbleIn .35s cubic-bezier(.2,1.4,.4,1);transform-origin:bottom left;min-width:0;flex:0 1 auto;max-width:46ch}
[dir=rtl] .bubble{transform-origin:bottom right}
.bubble::before{content:"";position:absolute;inset-inline-start:-7px;bottom:16px;width:14px;height:14px;background:inherit;border-inline-start:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);transform:rotate(45deg);border-bottom-left-radius:4px}
[dir=rtl] .bubble::before{transform:rotate(-45deg)}
.bubble b{color:var(--gold)}
@keyframes bubbleIn{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}

/* ----- welcome ----- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--glass-line);color:#fff;border-radius:30px;padding:30px 28px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(14,4,22,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 10%,rgba(255,154,122,.38),transparent 42%),radial-gradient(circle at 4% 100%,rgba(255,210,122,.3),transparent 46%);pointer-events:none}
.hero-txt{position:relative}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5.6vw,42px);line-height:1.15;margin:0 0 12px;font-weight:900;background:linear-gradient(120deg,#fff 15%,#FFE6BF 55%,#FFC857);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--txt2);max-width:46ch}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 24px rgba(14,4,22,.5))}
@media(max-width:620px){.hero{grid-template-columns:1fr;padding:24px 20px}.hero-art{max-width:300px;margin:6px auto 0}}
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{display:flex;gap:14px;align-items:center;background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:14px;font-weight:700;line-height:1.3;box-shadow:0 12px 30px rgba(14,4,22,.3),inset 0 1px 0 rgba(255,255,255,.16)}
.steps svg{width:44px;height:44px;flex:none;border-radius:14px;padding:10px;color:var(--on-light)}
.steps li:nth-child(1) svg{background:linear-gradient(135deg,#FFE9A8,#FFC857)}
.steps li:nth-child(2) svg{background:linear-gradient(135deg,#FFC38A,#F08A4B)}
.steps li:nth-child(3) svg{background:linear-gradient(135deg,#F6C6D9,#E7A6C8)}
.steps li:nth-child(4) svg{background:linear-gradient(135deg,#FFB9A0,#F2755A)}
.fine{font-size:14.5px;color:var(--txt2)}
details.info{margin:12px 0}
details.info summary{cursor:pointer;font-weight:700;color:var(--accent)}
.byline{font-size:14px;color:var(--txt3);margin:16px 0 0}

/* ----- avatar ----- */
.av-eye{transform-box:fill-box;transform-origin:center;animation:avblink 5s infinite}
@keyframes avblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.av-wrap{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.av-big{position:sticky;top:130px}
.av-big svg{width:170px;height:170px;border-radius:50%;border:4px solid transparent;background:linear-gradient(#E3EAF1,#E3EAF1) padding-box,var(--sun) border-box;box-shadow:0 0 40px rgba(255,169,77,.55);display:block}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 9px;border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);min-width:66px;font-size:12.5px;font-weight:600;text-align:center;transition:transform .12s}
.sw:hover span{transform:translateY(-2px)}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:block}
.sw input:checked+span{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,210,122,.5),0 0 20px rgba(255,210,122,.35);background:var(--glass-hi)}
.sw input:checked+span b{display:inline}
.sw input:focus-visible+span{outline:3px solid var(--focus)}
.sw b{display:none;position:absolute;top:-8px;inset-inline-end:-6px;background:var(--sun);color:var(--on-light);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:20px;text-align:center}
@media(max-width:560px){.av-wrap{grid-template-columns:1fr}.av-big{position:static;display:flex;justify-content:center}}

/* ----- plates (neutral light surface on purpose: keeps the colour test unbiased) ----- */
.plate-box{display:grid;place-items:center;background:#F7F6FB;border:1px solid var(--glass-line);border-radius:28px;padding:18px;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 24px 60px rgba(14,4,22,.45)}
.plate-box img{width:min(78vw,380px);height:auto;display:block;border-radius:50%;box-shadow:0 0 0 6px #fff,0 0 0 8px #D5D0EE}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px}
.ans{padding:16px 10px;border:1px solid var(--glass-line);border-radius:18px;background:var(--glass);font-weight:900;font-size:28px;cursor:pointer;min-height:68px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s,background .15s,box-shadow .15s}
.ans.txt{font-size:16px;font-weight:700}
.ans:hover{background:var(--glass-hi);transform:translateY(-2px);box-shadow:0 10px 26px rgba(255,210,122,.2),inset 0 1px 0 rgba(255,255,255,.2)}
.ans:active{transform:translateY(1px)}
.ans.sel{background:var(--sun);color:var(--on-light);border-color:transparent;box-shadow:0 8px 24px rgba(255,169,77,.55)}
.minibar{height:10px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .35s;box-shadow:0 0 14px rgba(255,210,122,.7)}
.meta{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px;color:var(--txt2);margin:0 0 8px}

/* ----- split-screen space view ----- */
.split{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.split-view{min-width:0}
.split-side{min-width:0}
.split-side .sign{margin-bottom:12px}
@media(min-width:900px){
  .split{grid-template-columns:minmax(0,1.3fr) minmax(360px,.7fr);gap:26px}
  .split-view{position:sticky;top:116px}
  .viewer{height:min(calc(100vh - 190px),640px)!important}
  .photo{max-height:calc(100vh - 190px);object-fit:contain;width:100%}
}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:7px 18px;font-weight:700;cursor:pointer;color:#fff}
.tab:hover{background:var(--glass-hi)}
.tab[aria-selected=true]{background:var(--sun);color:var(--on-light);border-color:transparent;box-shadow:0 6px 20px rgba(255,169,77,.5)}
.frame{position:relative;border-radius:26px;padding:6px;background:var(--sun-soft);border:1px solid var(--glass-line);box-shadow:0 24px 60px rgba(14,4,22,.5),0 0 60px rgba(232,102,58,.25)}
.viewer{width:100%;height:min(52vh,460px);border-radius:20px;overflow:hidden;background:rgba(22,8,34,.7)}
.photo{width:100%;display:block;border-radius:20px;cursor:zoom-in;background:#000}

.viewer{position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.viewer.grab{cursor:grabbing}
.viewer:focus-visible{box-shadow:0 0 0 3px #FFC857}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s}
.viewer.ready canvas{opacity:1}
.vload{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700}
.vload i{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#FFC857;animation:vspin .9s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.vctl{position:absolute;top:10px;inset-inline-end:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.vctl button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(20,8,32,.55);backdrop-filter:blur(6px);color:#fff;font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center;cursor:pointer}
.vctl button:hover{background:rgba(232,102,58,.8)}
.frame:fullscreen{display:flex;align-items:center;background:#0b0412;border-radius:0;padding:0}
.frame:fullscreen .viewer{height:100vh!important;border-radius:0}
@media (prefers-reduced-motion:reduce){.viewer canvas{transition:none}}
.hint{display:flex;gap:8px;align-items:center;color:var(--txt2);font-size:14.5px;font-weight:600;margin:12px 0 0}
.timer{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--on-light);color:var(--gold);font-size:13px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(18,7,28,.95);z-index:50;display:flex;flex-direction:column;padding:14px;overflow:auto}
.modal img{max-width:none;width:min(1200px,200vw);margin:auto;border-radius:10px}
.modal .btn{align-self:flex-end;margin-bottom:10px;position:sticky;top:0}

/* ----- rating ----- */
.rate-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:26px;padding:22px 18px 18px;margin-top:14px;box-shadow:0 18px 50px rgba(14,4,22,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.poles{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}
.poles span{flex:1;font-weight:900;font-size:clamp(17px,4vw,21px);line-height:1.2;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.poles span:last-child{align-items:flex-end;text-align:end}
.poles em{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:20px;line-height:1;font-weight:900;color:var(--on-light)}
.poles span:first-child em{background:linear-gradient(135deg,#FFB9A0,#F2755A);box-shadow:0 0 16px rgba(242,117,90,.5)}
.poles span:last-child em{background:linear-gradient(135deg,#FFE49A,#FFC857);box-shadow:0 0 16px rgba(255,200,87,.5)}
.scale{display:flex;gap:clamp(4px,1.2vw,8px);justify-content:space-between}
.scale button{flex:1;aspect-ratio:1/1.1;max-width:84px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);font-weight:900;font-size:clamp(18px,4.5vw,24px);cursor:pointer;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s,background .15s,box-shadow .15s}
.scale button:hover{background:var(--glass-hi);transform:translateY(-3px);box-shadow:0 10px 24px rgba(255,210,122,.25),inset 0 1px 0 rgba(255,255,255,.2)}
.scale button:active{transform:translateY(1px)}
.scale button.sel{background:var(--sun);color:var(--on-light);border-color:transparent;box-shadow:0 8px 26px rgba(255,169,77,.6)}
.scale button:nth-child(4){border-style:dashed}
.legend{margin-top:16px;font-size:13.5px;color:var(--txt2);display:flex;justify-content:space-between;gap:8px;font-weight:600}
.five{display:flex;gap:8px;margin-top:4px}
.five button{flex:1;padding:12px 0;border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);font-weight:900;font-size:20px;cursor:pointer;color:#fff}
.five button.sel{background:var(--sun);color:var(--on-light);border-color:transparent;box-shadow:0 6px 20px rgba(255,169,77,.5)}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--txt2);font-weight:600;margin-top:8px}

.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

.thumb.sel{border-color:transparent;background:var(--sun);color:var(--on-light);box-shadow:0 0 0 2px #fff,0 14px 40px rgba(255,169,77,.65)}

.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}

.scorecard .big{font-family:var(--serif);font-size:60px;font-weight:900;color:var(--gold);line-height:1;text-shadow:0 0 30px rgba(255,214,107,.55)}
.scorecard .rank{display:inline-block;background:var(--sun);color:var(--on-light);font-weight:900;padding:4px 18px;border-radius:99px;margin-top:10px;box-shadow:0 6px 20px rgba(255,169,77,.5)}
.logos{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-radius:16px;padding:10px 18px;margin:0 0 18px}

.logos img:first-child{width:min(62%,380px)}

.clist{margin:12px 0 18px;padding-inline-start:22px;display:grid;gap:10px;color:var(--txt2)}
.note{border-inline-start:5px solid var(--accent);background:rgba(255,210,122,.1);padding:12px 14px;border-radius:12px;margin-top:14px}
.status{margin-top:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

function guide(msg,mood,big){
  const useAv=CONFIG.GUIDE==='avatar'&&S.step!=='welcome'&&S.step!=='profile';
  const face=useAv?`<div class="face-av">${av(S.avatar,80)}</div>`:MASCOT;
  return `<div class="guide ${big?'big':''}"><div class="mascot ${mood==='cheer'?'cheer':''}" aria-hidden="true">${face}</div><div class="bubble">${msg}</div></div>`;
}

/* progress route */
function stationIdx(){
  const s=S.step;
  if(s==='welcome')return -1;
  if(s==='profile'||s==='avatar')return 0;
  if(s==='vision'||s==='plates'||s==='plateResult')return 1;
  if(s==='space'||s==='spaceDone')return 2+S.si;
  if(s==='overall'||s==='open')return 8;
  return 9;
}
function renderRoute(){
  const el=$('#route'),cur=stationIdx();
  if(cur<0){el.innerHTML='';el.style.display='none';return}
  el.style.display='flex';
  el.innerHTML=STR.en.sta.map((_,i)=>{
    const cls=i<cur?'done':(i===cur?'now':'');
    const dot=i===cur?`<span class="dot ${S.step==='profile'?'plain':''}">${S.step==='profile'?'':av(S.avatar,30)}</span>`:`<span class="dot"></span>`;
    return `<div class="stn ${cls}" title="${esc(T('sta')[i])}">${dot}${i<9?'<span class="seg"></span>':''}</div>`;
  }).join('');
}

/* ---------- scoring ---------- */
function screening(){
  let ok=0,tot=0,miss=0,control=true;let hint='';
  PLATES.forEach((P,i)=>{
    const a=S.plates[i+1];if(a===undefined)return;
    if(P.scored!==false){tot++;if(a===P.ans)ok++;else miss++}
    if(i===0&&a!==P.ans)control=false;
    if(P.path){if(a==='purple')hint+='protan-leaning ';if(a==='red')hint+='deutan-leaning '}
  });
  const result=miss>=3?'possible_cvd':(miss>=1?'borderline':'typical');
  return {ok,tot,miss,result,control,hint:hint.trim()};
}

 },
 ratePrev(){if(S.ii>0){S.ii--;save();refreshSide()}else{S.phase='look';save();refreshSide()}},
 nextSpace(){if(S.si<5)go('space',{si:S.si+1,phase:'look',ii:0,tab:null});else go('overall',{oi:0})},
 pick(b){const q=OVERALL[S.oi];const first=S.overall[q[0]]===undefined;S.overall[q[0]]=+b.dataset.v;if(first)addXP(20);save();document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('sel',x===b));setTimeout(()=>{if(S.oi<OVERALL.length-1){S.oi++;save();render();window.scrollTo({top:0})}else go('open')},250)},
 overallPrev(){if(S.oi>0){S.oi--;save();render()}else go('spaceDone',{si:5})},
 openPrev(){go('overall',{oi:OVERALL.length-1})},
 finish(){
  clearErrs();if(firstBad([['open',S.open.trim().length<3?T('req'):'']]))return;
  go('consent');
 },
 consentPrev(){go('open')},
 submitAll(){
  clearErrs();const f=S.fin||{},R=T('req'),em=(f.email||'').trim();
  const list=[['c_name',(f.name||'').trim().length<2?R:''],['interview',!f.interview?R:''],['c_email',em&&!/^\S+@\S+\.\S+$/.test(em)?T('reqe'):'']];
  if(firstBad(list))return;
  if(!S.flags.finXP){S.flags.finXP=1;S.xp+=30+100}S.tEnd=S.tEnd||Date.now();go('done');submit();
 },
 retry(){submit()},
 dl(){const r=window.__lastRecord||record();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(r)],{type:'text/csv;charset=utf-8'}));a.download='response-'+S.id.slice(0,8)+'.csv';a.click()},
 newResp(){ACT.restart()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];f&&f(b)});

/* form inputs */
document.addEventListener('input',e=>{
  const t=e.target,nm=t.name;if(!nm&&t.id!=='open'&&t.id!=='consent'&&t.id!=='av_glasses'&&t.id!=='av_beard'&&t.id!=='av_phones')return;
  if(S.step==='profile'){S.profile[nm]=t.value;if(nm==='faculty'){$('#facOtherBox').hidden=t.value!=='Other'}save()}
  else if(S.step==='avatar'){
    if(t.id==='av_glasses')S.avatar.glasses=t.checked;else if(t.id==='av_beard')S.avatar.beard=t.checked;else if(t.id==='av_phones')S.avatar.phones=t.checked;else if(nm&&nm.startsWith('av_'))S.avatar[nm.slice(3)]=+t.value;
    $('#avBig').innerHTML=av(S.avatar,150);save()}
  else if(S.step==='vision'){S.vision[nm]=t.value;if(nm==='eye')$('#eyeOtherBox').hidden=t.value!=='Other';save()}
  else if(S.step==='consent'){S.fin=S.fin||{};S.fin[nm]=t.value;save()}
  else if(S.step==='open'){S.open=t.value;save()}
  else if(S.step==='welcome'&&t.id==='consent'){S.consent=t.checked;$('#consentErr').hidden=true;save()}
});
document.addEventListener('keydown',e=>{
  if(S.step==='space'&&S.phase==='rate'&&/^[1-7]$/.test(e.key)&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){const b=document.querySelector(`.scale button[data-v="${e.key}"]`);b&&b.click()}
  if(e.key==='Escape'){const m=document.querySelector('.modal');m&&m.remove()}
});
$('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();render()});

/* boot */
(function(){const s=loadSaved();if(s&&s.lang)S.lang=s.lang;render();window.__S=()=>S;window.__ACT=ACT;flushPending();window.addEventListener('online',flushPending)})();
</script>
</body>
</html>
